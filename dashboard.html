<!DOCTYPE html>
<html lang="ko" class="h-full antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signalmate</title>
  <meta name="description" content="Signalmate - 금융 서비스" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#3b6bef',
              600: '#2f5cd8',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .stock-btn:hover { background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-50">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <!-- Logo -->
      <a class="flex items-center gap-2 shrink-0" href="/dashboard.html">
        <div class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center">
          <span class="text-white text-sm font-bold">S</span>
        </div>
        <div class="hidden sm:block">
          <p class="text-sm font-bold text-slate-900 leading-tight">Signalmate</p>
          <p class="text-[10px] text-slate-400 leading-tight">쉬운 종목 리서치</p>
        </div>
      </a>

      <!-- Right actions -->
      <div class="flex items-center gap-1 sm:gap-2">
        <!-- Notification -->
        <a aria-label="알림" class="relative w-9 h-9 inline-flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-700" href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] font-bold inline-flex items-center justify-center">38</span>
        </a>

        <!-- Advisor inbox -->
        <a class="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-100 hover:bg-blue-100" href="#">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
          </svg>
          <span class="hidden sm:inline">상담 인박스</span>
        </a>

        <!-- User menu -->
        <div class="relative">
          <button id="userMenuBtn" class="w-9 h-9 inline-flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold" aria-label="사용자 메뉴">L</button>
          <div id="userMenu" class="hidden absolute right-0 mt-2 w-36 bg-white rounded-xl border border-slate-200 shadow-lg py-1 text-sm">
            <a href="/login.html" class="block px-4 py-2 text-slate-700 hover:bg-slate-50">로그아웃</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main>
    <div class="px-4 sm:px-6 lg:px-8 py-6 sm:py-8 max-w-[1400px] mx-auto space-y-5">

      <!-- Hero section -->
      <section class="bg-white rounded-xl border border-slate-200 p-6 sm:p-8">
        <div class="max-w-2xl">
          <span class="inline-block px-2 py-0.5 rounded text-[11px] font-medium bg-blue-100 text-blue-700">쉬운 종목 리서치</span>
          <h1 class="mt-3 text-2xl sm:text-3xl font-extrabold text-slate-900 leading-snug">
            국내외 애널리스트의 어려운 리포트를 <br class="hidden sm:block" />요점만 정리해서 알려드려요.
          </h1>
          <p class="mt-3 text-sm text-slate-500 leading-relaxed">
            여러 리포트들을 AI로 분석 후 종합하여 매수 포인트와 경계 포인트를 쉽게 알려드려요.
          </p>
        </div>
        <form class="relative mt-6" autocomplete="off" onsubmit="return false;">
          <div class="flex gap-2 bg-white border border-slate-300 rounded-xl p-1.5 focus-within:border-slate-900 transition-colors">
            <input id="searchInput" placeholder="기업명 또는 티커 (예: 삼성전자, AAPL)" class="flex-1 px-3 py-2 text-sm bg-transparent outline-none placeholder-slate-400" type="text" value="" oninput="toggleSearch(this)" />
            <button id="searchBtn" type="submit" class="px-4 py-2 rounded-lg bg-brand-500 text-white text-sm font-semibold hover:bg-brand-600 transition-colors disabled:opacity-50" disabled>검색</button>
          </div>
        </form>
      </section>

      <!-- Two-column section -->
      <section class="grid grid-cols-1 lg:grid-cols-2 gap-5">

        <!-- Popular stocks -->
        <article class="bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col">
          <header class="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-sm font-semibold text-slate-900">많이 본 주식</p>
              <p class="text-[11px] text-slate-400">최근 7일 인기 검색</p>
            </div>
            <div class="shrink-0">
              <div class="inline-flex rounded-lg border border-slate-200 overflow-hidden text-[11px]">
                <button id="tabKR" type="button" onclick="switchTab('KR')" class="px-2.5 py-1 font-semibold transition-colors bg-brand-500 text-white">국내</button>
                <button id="tabUS" type="button" onclick="switchTab('US')" class="px-2.5 py-1 font-semibold transition-colors bg-white text-slate-600 hover:bg-slate-50">미국</button>
              </div>
            </div>
          </header>
          <div class="p-2">
            <ul id="stockListKR" class="space-y-0.5">
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">삼성전자</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">005930</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">SK하이닉스</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">000660</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">LG전자</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">066570</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">두산에너빌리티</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">034020</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">NAVER</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">035420</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">한화에어로스페이스</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">012450</span></div></button></li>
            </ul>
            <ul id="stockListUS" class="space-y-0.5 hidden">
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">Apple Inc.</p><p class="text-[11px] text-slate-400">Technology</p></div><div class="text-right"><span class="text-[11px] text-slate-400">AAPL</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">NVIDIA Corporation</p><p class="text-[11px] text-slate-400">Technology</p></div><div class="text-right"><span class="text-[11px] text-slate-400">NVDA</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">Microsoft Corporation</p><p class="text-[11px] text-slate-400">Technology</p></div><div class="text-right"><span class="text-[11px] text-slate-400">MSFT</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">Alphabet Inc.</p><p class="text-[11px] text-slate-400">Technology</p></div><div class="text-right"><span class="text-[11px] text-slate-400">GOOGL</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">Tesla, Inc.</p><p class="text-[11px] text-slate-400">Auto</p></div><div class="text-right"><span class="text-[11px] text-slate-400">TSLA</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">Meta Platforms</p><p class="text-[11px] text-slate-400">Technology</p></div><div class="text-right"><span class="text-[11px] text-slate-400">META</span></div></button></li>
            </ul>
          </div>
        </article>

        <!-- Recent searches -->
        <article class="bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col">
          <header class="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-sm font-semibold text-slate-900">최근에 검색한 주식</p>
              <p class="text-[11px] text-slate-400">내가 본 종목</p>
            </div>
          </header>
          <div class="p-2">
            <ul class="space-y-0.5">
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">삼천당제약</p><p class="text-[11px] text-slate-400">KOSDAQ</p></div><div class="text-right"><span class="text-[11px] text-slate-400">000250</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">NAVER</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">035420</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">Alphabet Inc. Class A Common Stock</p><p class="text-[11px] text-slate-400">Technology</p></div><div class="text-right"><span class="text-[11px] text-slate-400">GOOGL</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">한화에어로스페이스</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">012450</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">삼성전자</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">005930</span></div></button></li>
              <li><button class="stock-btn w-full px-3 py-2 flex items-center justify-between rounded-lg transition-colors text-left"><div><p class="text-sm font-semibold text-slate-900">한국콜마</p><p class="text-[11px] text-slate-400">KOSPI</p></div><div class="text-right"><span class="text-[11px] text-slate-400">161890</span></div></button></li>
            </ul>
          </div>
        </article>
      </section>

      <!-- Banners -->
      <section class="pt-2 max-w-3xl mx-auto w-full grid grid-cols-1 sm:grid-cols-2 gap-3">
        <a href="#" target="_blank" rel="noopener noreferrer" class="block overflow-hidden rounded-xl hover:opacity-90 transition-opacity bg-gradient-to-br from-blue-500 to-indigo-600 p-6 text-white">
          <p class="text-xs font-semibold opacity-80 mb-1">공식 소개</p>
          <p class="text-base font-bold leading-snug">Signalmate가 궁금하다면?<br/>공식 소개 페이지 보기 →</p>
        </a>
        <a href="#" target="_blank" rel="noopener noreferrer" class="block overflow-hidden rounded-xl hover:opacity-90 transition-opacity bg-gradient-to-br from-sky-400 to-cyan-500 p-6 text-white">
          <p class="text-xs font-semibold opacity-80 mb-1">커뮤니티</p>
          <p class="text-base font-bold leading-snug">텔레그램 채널 입장하기<br/>실시간 알림 받기 →</p>
        </a>
      </section>

    </div>
  </main>

  <script>
    function toggleSearch(input) {
      document.getElementById('searchBtn').disabled = input.value.trim() === '';
    }

    function switchTab(tab) {
      if (tab === 'KR') {
        document.getElementById('tabKR').className = 'px-2.5 py-1 font-semibold transition-colors bg-brand-500 text-white';
        document.getElementById('tabUS').className = 'px-2.5 py-1 font-semibold transition-colors bg-white text-slate-600 hover:bg-slate-50';
        document.getElementById('stockListKR').classList.remove('hidden');
        document.getElementById('stockListUS').classList.add('hidden');
      } else {
        document.getElementById('tabUS').className = 'px-2.5 py-1 font-semibold transition-colors bg-brand-500 text-white';
        document.getElementById('tabKR').className = 'px-2.5 py-1 font-semibold transition-colors bg-white text-slate-600 hover:bg-slate-50';
        document.getElementById('stockListUS').classList.remove('hidden');
        document.getElementById('stockListKR').classList.add('hidden');
      }
    }

    // Tailwind brand color workaround
    document.querySelectorAll('[id^="tab"]').forEach(el => {
      if (el.classList.contains('bg-brand-500')) {
        el.style.backgroundColor = '#3b6bef';
        el.style.color = 'white';
      }
    });

    document.getElementById('userMenuBtn').addEventListener('click', function() {
      const menu = document.getElementById('userMenu');
      menu.classList.toggle('hidden');
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#userMenuBtn') && !e.target.closest('#userMenu')) {
        document.getElementById('userMenu').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
