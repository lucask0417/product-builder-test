<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - Signalmate</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .logo .dot {
      color: #4f46e5;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      position: relative;
    }

    .steps::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 28px;
      right: 28px;
      height: 2px;
      background: #e5e7eb;
      z-index: 0;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      background: #e5e7eb;
      color: #9ca3af;
    }

    .step.active .step-circle {
      background: #4f46e5;
      color: #ffffff;
    }

    .step.done .step-circle {
      background: #4f46e5;
      color: #ffffff;
    }

    .step-label {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      white-space: nowrap;
    }

    .step.active .step-label {
      color: #4f46e5;
      font-weight: 600;
    }

    .form-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .form-desc {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      background: #ffffff;
    }

    .form-group input::placeholder {
      color: #c4c9d4;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: #d1d5db;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    .auth-code-section {
      display: none;
      margin-top: 4px;
    }

    .auth-code-section.visible {
      display: block;
    }

    .auth-note {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.6;
      margin-top: 16px;
      padding: 12px 14px;
      background: #f9fafb;
      border-radius: 8px;
      border-left: 3px solid #4f46e5;
    }

    .footer {
      margin-top: 28px;
      font-size: 11.5px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.7;
    }

    .footer a {
      color: #6b7280;
      text-decoration: underline;
      cursor: pointer;
    }

    .footer a:hover {
      color: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>Signal<span class="dot">mate</span></h1>
    </div>

    <p class="form-title">이메일로 로그인</p>
    <p class="form-desc">
      이메일 주소를 입력하고 로그인하세요.
    </p>

    <form id="loginForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="email">이메일 주소</label>
        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="비밀번호를 입력하세요"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">로그인</button>
    </form>

    <div class="footer">
      계속 진행하면 Signalmate의
      <a>이용약관</a> 및 <a>개인정보처리방침</a>에<br />
      동의하는 것으로 간주됩니다.
    </div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
